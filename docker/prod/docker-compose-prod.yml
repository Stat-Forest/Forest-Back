services:
  forest_app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_app_prod
    env_file:
      - ../../.env
    entrypoint: ["/entrypoint.sh"]
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
      - ../../src:/app
      - ../../docker/prod/backup.sh:/app/docker/prod/backup.sh
      - backups_data:/backups

    ports:
      - "8000:8000"
    depends_on:
      - forest_postgres
      - forest_redis
    restart: always
    networks:
      - forest_network

  forest_nginx:
    image: nginx:latest
    container_name: forest_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - forest_app
    volumes:
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
      - ../../docker/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/www/certbot
      - /etc/localtime:/etc/localtime:ro
      - /var/www/stat-ormon:/var/www/stat-ormon
    restart: always
    networks:
      - forest_network

  forest_certbot:
    image: certbot/certbot
    container_name: forest_certbot
    volumes:
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/www/certbot
    command: >
      certonly --webroot --webroot-path=/var/www/certbot 
      --email tolqinovoybek92@gmail.com 
      --agree-tos 
      --no-eff-email 
      -d forest.yutori.uz
      -d stat-urmon.uz

  forest_postgres:
    image: postgres:16
    container_name: forest_postgres_prod
    env_file:
      - ../../.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forest_network
    restart: always

  forest_redis:
    image: redis:7.0.15
    container_name: forest_redis_prod
    volumes:
      - redis_data:/data
    networks:
      - forest_network
    restart: always

  forest_celery_worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_celery_worker_prod
    env_file:
      - ../../.env
    command: celery -A config worker --loglevel=info
    depends_on:
      - forest_redis
      - forest_postgres
    networks:
      - forest_network
    restart: always

  forest_celery_beat:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_celery_beat_prod
    env_file:
      - ../../.env
    command: celery -A config beat --loglevel=info
    depends_on:
      - forest_celery_worker
    networks:
      - forest_network
    restart: always

volumes:
  postgres_data:
  redis_data:
  certbot-etc:
  certbot-var:
  backups_data:


networks:
  forest_network:
