version: '3.8'

services:
  forest_app:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_app_prod
    env_file:
      - ../../.env
    entrypoint: ["/entrypoint.sh"]
    # HTTP: gunicorn (WSGI) bir nechta worker bilan. Ilgari bitta daphne jarayoni
    # ishlardi — DRF view'lari sinxron, Daphne ularni BITTA thread'da navbat bilan
    # bajaradi (6 ta parallel so'rov 1 s o'rniga 3.5 s olardi). WebSocket (chat)
    # endi alohida forest_ws konteynerida (daphne), nginx /ws/ ni unga yo'naltiradi.
    # Worker soni: .env dagi GUNICORN_WORKERS (odatda 2*CPU+1), har worker 2 thread.
    # ($$ — compose interpolyatsiyasi emas, konteyner ichidagi sh o'qiydi; .env
    # env_file orqali konteynerga kiradi.)
    command:
      - sh
      - -c
      - >-
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers "$${GUNICORN_WORKERS:-4}"
        --threads 2
        --worker-class gthread
        --timeout 120
        --graceful-timeout 30
        --max-requests 2000
        --max-requests-jitter 200
        --access-logfile /var/log/forest-back/gunicorn-access.log
        --error-logfile /var/log/forest-back/gunicorn-error.log

    volumes:
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
      - ../../src:/app
      - ../../docker/prod/backup.sh:/app/docker/prod/backup.sh
      - ../../.env:/app/.env
      - ../../backups:/backups
      - /var/log/forest-back:/var/log/forest-back
    # Port tashqariga ochilmaydi — faqat nginx (docker tarmog'i) orqali.
    depends_on:
      - forest_postgres
      - forest_redis
      - e_imzo_server        # ← qo'shildi
    restart: always
    networks:
      - forest_network

  # WebSocket (chat): daphne, faqat /ws/ trafigi. Migratsiya/collectstatic
  # forest_app entrypoint'ida bajariladi — bu yerda takrorlanmaydi.
  forest_ws:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_ws_prod
    env_file:
      - ../../.env
    command: >
      daphne -b 0.0.0.0 -p 8001
      --access-log /var/log/forest-back/daphne-access.log
      config.asgi:application
    volumes:
      - ../../media:/app/media
      - ../../src:/app
      - ../../.env:/app/.env
      - /var/log/forest-back:/var/log/forest-back
    depends_on:
      - forest_app
      - forest_redis
    restart: always
    networks:
      - forest_network

  forest_nginx:
    image: nginx:latest
    container_name: forest_nginx_prod
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - forest_app
    volumes:
      - ../../staticfiles:/app/staticfiles
      - ../../media:/app/media
      - ../../docker/prod/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/www/certbot
      - /etc/localtime:/etc/localtime:ro
      - /var/www/stat-ormon:/var/www/stat-ormon
    restart: always
    networks:
      - forest_network

  # forest.yutori.uz — eskirgan domen, chiqarib tashlanish arafasida (api.stat-urmon.uz
  # uni almashtirdi). stat-urmon.uz va api.stat-urmon.uz endi MUSTAQIL sertifikatlarga
  # ega — forest.yutori.uz'ning taqdiridan (DNS o'chirilishi, cert yangilanmay qolishi)
  # ta'sirlanmaydi. Ular shu xizmatni qayta ishlatib emas, alohida buyruq bilan olingan:
  #   docker-compose -f docker/prod/docker-compose-prod.yml run --rm forest_certbot \
  #     certonly --webroot --webroot-path=/var/www/certbot \
  #     --email tolqinovoybek92@gmail.com --agree-tos --no-eff-email \
  #     --cert-name stat-urmon.uz --expand -d stat-urmon.uz -d www.stat-urmon.uz
  #   docker-compose -f docker/prod/docker-compose-prod.yml run --rm forest_certbot \
  #     certonly --webroot --webroot-path=/var/www/certbot \
  #     --email tolqinovoybek92@gmail.com --agree-tos --no-eff-email \
  #     -d api.stat-urmon.uz
  forest_certbot:
    image: certbot/certbot
    container_name: forest_certbot
    volumes:
      - ./certbot/etc:/etc/letsencrypt
      - ./certbot/var:/var/www/certbot
    command: >
      certonly --webroot --webroot-path=/var/www/certbot
      --email tolqinovoybek92@gmail.com
      --agree-tos
      --no-eff-email
      -d forest.yutori.uz

  forest_postgres:
    image: postgres:16
    container_name: forest_postgres_prod
    env_file:
      - ../../.env
    # Standart sozlama (shared_buffers 128 MB) 7.7 GB serverda kam: GeoJSON/hisobot
    # jadvallari diskdan o'qiladi. Deploy skripti bu servisni QAYTA YARATMAYDI —
    # serverda qo'lda: compose stop/rm -f/up -d --no-deps forest_postgres
    # (ma'lumotlar volume'da, ~10 s uzilish).
    command: >-
      postgres
      -c shared_buffers=1GB
      -c effective_cache_size=3GB
      -c work_mem=16MB
      -c maintenance_work_mem=256MB
      -c random_page_cost=1.1
      -c max_connections=120
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - forest_network
    restart: always

  forest_redis:
    image: redis:7.0.15
    container_name: forest_redis_prod
    volumes:
      - redis_data:/data
    networks:
      - forest_network
    restart: always

  forest_celery_worker:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_celery_worker_prod
    env_file:
      - ../../.env
    command: celery -A config worker --loglevel=info
    depends_on:
      - forest_redis
      - forest_postgres
    networks:
      - forest_network
    restart: always

  forest_celery_beat:
    build:
      context: ../..
      dockerfile: docker/prod/Dockerfile
    container_name: forest_celery_beat_prod
    env_file:
      - ../../.env
    command: celery -A config beat --loglevel=info
    depends_on:
      - forest_celery_worker
    networks:
      - forest_network
    restart: always

  # ---------------- E-IMZO SERVER ----------------
  e_imzo_server:
    build:
      context: ../../e-imzo-server
      dockerfile: Dockerfile
    container_name: e_imzo_server_prod
    # DIQQAT: port tashqariga ochilmaydi. Ilgari 8080 internetga ochiq edi —
    # istalgan odam /info (VPN kalit ma'lumoti), /backend/* ni chaqira olardi.
    # Backend unga docker tarmog'i orqali e_imzo_server:8080 da ulanadi.
    networks:
      - forest_network
    restart: always
    environment:
      - TZ=Asia/Tashkent


volumes:
  postgres_data:
  redis_data:
  certbot-etc:
  certbot-var:
  backups_data:

networks:
  forest_network:
