# HTTP -> HTTPS avtomatik redirect
server {
    listen 80;
    server_name statforest.yutori.uz;

    location / {
        return 301 https://$host$request_uri;
    }

    location ~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    server_name statforest.yutori.uz;

    ssl_certificate /etc/letsencrypt/live/statforest.yutori.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/statforest.yutori.uz/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    root /var/www/stat-ormon;
    index index.html;

    location / {
        try_files $uri /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
