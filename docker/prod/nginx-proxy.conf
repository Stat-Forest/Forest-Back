events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server {
        listen 80;
        server_name forest.yutori.uz statforest.yutori.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name forest.yutori.uz;

        ssl_certificate /etc/letsencrypt/live/forest.yutori.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/forest.yutori.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        location /static/ {
            proxy_pass https://forest_nginx_prod:80/static/;
            proxy_set_header Host $host;
        }

        location /media/ {
            proxy_pass https://forest_nginx_prod:80/media/;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass https://forest_nginx_prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    server {
        listen 443 ssl;
        server_name statforest.yutori.uz;

        ssl_certificate /etc/letsencrypt/live/statforest.yutori.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/statforest.yutori.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/stat-ormon;
        index index.html;

        location / {
            proxy_pass http://frontend_nginx_prod:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            try_files $uri /index.html;
        }

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 1y;
            access_log off;
            add_header Cache-Control "public";
        }

        location ~ /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
