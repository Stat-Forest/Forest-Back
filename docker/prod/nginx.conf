events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    # Versiya ko'rsatilmasin (Server: nginx)
    server_tokens off;

    # So'rov vaqti bilan log: $request_time (jami), $upstream_response_time (Django).
    # O'qish: docker logs forest_nginx_prod | grep ' rt=' | sort -k... (docs/2026-10-10-tezlik-auditi.md)
    log_format timed '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                     'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout timed;
    # Imzolangan media havolalari (?t=<token>) log'ga tushmasin — token bearer (audit PM1/F16)
    log_format timed_nouri '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent '
                           'rt=$request_time urt=$upstream_response_time';

    # Admin login brute-force: IP bo'yicha 10 so'rov/min (API login'da DRF
    # throttle bor, Django admin'da yo'q)
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;
    limit_req_status 429;

    # ────────── PERFORMANCE ──────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ────────── PROXY BUFFERING ──────────
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ────────── GZIP COMPRESSION ──────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ────────── DOCKER DNS RESOLVER ──────────
    # proxy_pass'da literal hostname ishlatilsa, nginx IP'ni faqat startup'da
    # bir marta aniqlab, cache qiladi. Docker konteynerlari qayta yaratilganda
    # (deploy/rebuild) yangi IP oladi va nginx eski IP'ga urinib 502 beradi.
    # Resolver + proxy_pass'dagi o'zgaruvchi bilan nginx hostname'ni runtime'da
    # (har `valid` oralig'ida) qayta aniqlaydi — deploy'dan keyin restart shart emas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_origin $cors_origin {
        default "";
        "https://stat-urmon.uz" $http_origin;
        "https://www.stat-urmon.uz" $http_origin;
    }

    # ────────────── MAIN HTTPS SERVER (api.stat-urmon.uz) ──────────────
    # Backend/swagger domeni (forest.yutori.uz o'rnini bosdi, uning bloklari
    # olib tashlangan).
    server {
        listen 443 ssl;
        server_name api.stat-urmon.uz;

        ssl_certificate /etc/letsencrypt/live/api.stat-urmon.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.stat-urmon.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" (audit C11): faqat AEAD + forward secrecy
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # Xavfsizlik header'lari. nginx'da location ichida add_header bo'lsa
        # server darajasidagilar o'sha location'da yo'qoladi — shuning uchun
        # add_header ishlatadigan location'larda ular takrorlanadi.
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        client_max_body_size 20M;

        set $forest_app forest_app_prod;
        set $forest_ws forest_ws_prod;

        # ────────────── STATIC FILES ──────────────
        location /static/ {
            alias /app/staticfiles/;
        }

        # ────────────── MEDIA FILES ──────────────
        # Hech qachon tashqariga berilmaydigan papkalar (^~ — regex'lardan ustun):
        # legacy_billing — eski billing eksporti (ijarachilar PII, 2026-10-27
        # hodisasi), exports — eski admin ZIP eksportlari, backups — zaxira.
        location ^~ /media/legacy_billing/ { return 404; }
        location ^~ /media/exports/ { return 404; }
        location ^~ /media/backups/ { return 404; }

        # Himoyalangan papkalar (yer hujjatlari, rezyumelar, ma'lumotnomalar):
        # so'rov Django'ga boradi, u imzolangan ?t= tokenni (yoki admin
        # sessiyasini) tekshirib X-Accel-Redirect bilan /protected-media/ ga
        # yo'naltiradi. Regex location — pastdagi prefix location'lardan ustun.
        location ~ ^/media/(documents|resumes|handbooks|legacy_billing)/ {
            access_log /dev/stdout timed_nouri;
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        location /protected-media/ {
            internal;
            alias /app/media/;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
        }

        # Foydalanuvchi yuklagan fayllar. HTML/SVG/JS/XML kabi turlar brauzerda
        # ochilmasin (stored XSS: admin shu domenda) — faqat yuklab olinadi.
        location ~* ^/media/(.+\.(html?|shtml|xht|xhtml|svgz?|xml|xsl|js|mjs|htc|swf))$ {
            alias /app/media/$1;
            add_header Content-Disposition "attachment" always;
            add_header X-Content-Type-Options "nosniff" always;
            default_type application/octet-stream;
        }

        location /media/ {
            alias /app/media/;
            add_header X-Content-Type-Options "nosniff" always;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ────────────── API (CORS faqat nginx boshqaradi) ──────────────
        location /api/ {
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ────────────── WEBSOCKET (chat) ──────────────
        location /ws/ {
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            # WebSocket alohida daphne konteynerida (forest_ws); HTTP gunicorn'da.
            proxy_pass http://$forest_ws:8001;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ────────────── ALL OTHER REQUESTS → DJANGO ──────────────
        # Admin login — brute-force cheklovi
        location = /admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
        }

        # Ijara billing adminkasi login — xuddi shu brute-force cheklovi
        location = /billing-admin/login/ {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;
        }

        location / {
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Django o'zi X-Frame-Options/Referrer-Policy qo'yadi — nginx'niki
            # bilan ikki marta kelmasin (nginx'niki server darajasida qo'yiladi)
            proxy_hide_header X-Frame-Options;
            proxy_hide_header Referrer-Policy;
            proxy_hide_header X-Content-Type-Options;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
    }

    # ────────────── HTTP → HTTPS REDIRECT (stat-urmon.uz, www.stat-urmon.uz) ──────────────
    # www ham shu yerda: acme-challenge www uchun ham ishlashi kerak (sertifikat
    # olish uchun), qolgan hamma so'rov asosiy domenga yo'naltiriladi.
    server {
        listen 80;
        server_name stat-urmon.uz www.stat-urmon.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://stat-urmon.uz$request_uri;
        }
    }

    # ────────────── HTTP → HTTPS REDIRECT (api.stat-urmon.uz) ──────────────
    # Yangi backend/swagger domeni (forest.yutori.uz o'rnini bosadi).
    # Sertifikat olinguncha faqat shu :80 blok kerak (acme-challenge uchun).
    server {
        listen 80;
        server_name api.stat-urmon.uz;

        client_max_body_size 20M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ────────────── HTTPS www.stat-urmon.uz → stat-urmon.uz ──────────────
    # stat-urmon.uz sertifikati www'ni ham qamrab olishi kerak (--expand bilan
    # olinadi, docker-compose-prod.yml dagi izohga qarang). Unga qadar www
    # brauzerda sertifikat ogohlantirishi beradi — bu blok bo'lmasa ham shunday edi.
    server {
        listen 443 ssl;
        http2 on;
        server_name www.stat-urmon.uz;

        ssl_certificate /etc/letsencrypt/live/stat-urmon.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stat-urmon.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" (audit C11): faqat AEAD + forward secrecy
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        return 301 https://stat-urmon.uz$request_uri;
    }

    # ────────────── FRONTEND HTTPS (stat-urmon.uz) ──────────────
    server {
        listen 443 ssl;
        # HTTP/2: bitta ulanishda barcha JS/CSS chunk'lar parallel yuklanadi
        # (HTTP/1.1 da brauzer 6 tadan ortiq faylni navbatga qo'yardi)
        http2 on;
        server_name stat-urmon.uz;

        ssl_certificate /etc/letsencrypt/live/stat-urmon.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/stat-urmon.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        # Mozilla "intermediate" (audit C11): faqat AEAD + forward secrecy
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_tickets off;

        # Xavfsizlik header'lari (add_header bo'lgan location'larda takrorlanadi)
        add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Content-Security-Policy (audit A6): faqat o'z skriptlari (+ Clarity, faqat
        # landing sahifada yuklanadi — public/clarity.js), API/WS faqat api.stat-urmon.uz,
        # E-IMZO lokal agenti (127.0.0.1:64443/64646), shriftlar Google Fonts.
        # index.html da inline skript yo'q (theme-init.js, clarity.js alohida fayl).
        set $csp "default-src 'self'; script-src 'self' https://www.clarity.ms https://scripts.clarity.ms; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://api.stat-urmon.uz wss://api.stat-urmon.uz https://*.clarity.ms wss://127.0.0.1:64443 ws://127.0.0.1:64646; worker-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'";
        root /var/www/stat-ormon;
        index index.html;

        # Fayl nomi hash'langan (masalan index-DR0cwwmf.js) — mazmuni
        # o'zgarsa nomi ham o'zgaradi, shuning uchun abadiy keshlash xavfsiz.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        }

        # index.html (va SPA fallback) HECH QACHON keshlanmasligi kerak —
        # aks holda deploy'dan keyin brauzer eski index.html'ni ishlatib,
        # o'chirilgan assets fayllariga (eski hash) ishora qilib qoladi va
        # foydalanuvchi "module script" xatosi bilan oq ekran ko'radi.
        location / {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy $csp always;
            add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
            try_files $uri /index.html;
        }
    }
}