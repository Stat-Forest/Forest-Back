events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ────────── PERFORMANCE ──────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ────────── PROXY BUFFERING ──────────
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # ────────── GZIP COMPRESSION ──────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ────────── DOCKER DNS RESOLVER ──────────
    # proxy_pass'da literal hostname ishlatilsa, nginx IP'ni faqat startup'da
    # bir marta aniqlab, cache qiladi. Docker konteynerlari qayta yaratilganda
    # (deploy/rebuild) yangi IP oladi va nginx eski IP'ga urinib 502 beradi.
    # Resolver + proxy_pass'dagi o'zgaruvchi bilan nginx hostname'ni runtime'da
    # (har `valid` oralig'ida) qayta aniqlaydi — deploy'dan keyin restart shart emas.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    map $http_origin $cors_origin {
        default "";
        "https://stat-urmon.uz" $http_origin;
    }

    # ────────────── HTTP → HTTPS REDIRECT (forest.yutori.uz) ──────────────
    server {
        listen 80;
        server_name forest.yutori.uz;

        client_max_body_size 20M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ────────────── MAIN HTTPS SERVER (forest.yutori.uz) ──────────────
    server {
        listen 443 ssl;
        server_name forest.yutori.uz;

        ssl_certificate /etc/letsencrypt/live/forest.yutori.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/forest.yutori.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        client_max_body_size 20M;

        # proxy_pass o'zgaruvchi orqali — nginx hostname'ni runtime'da resolver
        # yordamida qayta aniqlaydi (konteyner qayta yaratilsa 502 bo'lmaydi).
        set $forest_app forest_app_prod;

        # ────────────── STATIC FILES ──────────────
        location /static/ {
            alias /app/staticfiles/;
        }

        # ────────────── MEDIA FILES ──────────────
        location /media/ {
            alias /app/media/;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods "GET, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # proxy_pass o'zgaruvchi orqali — nginx hostname'ni runtime'da resolver yordamida aniqlaydi
        set $e_imzo_server e_imzo_server;

        # ────────────── E-IMZO SERVER PROXY ──────────────
        location /e-imzo/ {
            proxy_pass http://$e_imzo_server:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ────────────── API (CORS faqat nginx boshqaradi) ──────────────
        location /api/ {
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;

            add_header Access-Control-Allow-Origin $cors_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken" always;

            if ($request_method = OPTIONS) {
                add_header Access-Control-Allow-Origin $cors_origin;
                add_header Access-Control-Allow-Credentials true;
                add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
                add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-CSRFToken";
                add_header Content-Length 0;
                add_header Content-Type text/plain;
                return 204;
            }
        }

        # ────────────── WEBSOCKET (chat) ──────────────
        location /ws/ {
            proxy_pass http://$forest_app:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ────────────── ALL OTHER REQUESTS → DJANGO ──────────────
        location / {
            proxy_pass http://$forest_app:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_hide_header Access-Control-Allow-Origin;
            proxy_hide_header Access-Control-Allow-Credentials;
            proxy_hide_header Access-Control-Allow-Methods;
            proxy_hide_header Access-Control-Allow-Headers;
        }
    }

    # ────────────── HTTP → HTTPS REDIRECT (stat-urmon.uz) ──────────────
    server {
        listen 80;
        server_name stat-urmon.uz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ────────────── FRONTEND HTTPS (stat-urmon.uz) ──────────────
    server {
        listen 443 ssl;
        server_name stat-urmon.uz;

        ssl_certificate /etc/letsencrypt/live/forest.yutori.uz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/forest.yutori.uz/privkey.pem;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        root /var/www/stat-ormon;
        index index.html;

        location / {
            try_files $uri /index.html;
        }
    }
}