services:
  forest_app:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: forest_app_container
    command: >
      sh -c "
      python manage.py makemigrations --noinput &&
      python manage.py migrate --noinput &&
      python manage.py collectstatic --noinput &&
      python manage.py runserver 0.0.0.0:8000"
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    volumes:
      - ../../src:/app
    depends_on:
      - forest_postgres
      - forest_redis

  forest_postgres:
    image: postgres:16
    container_name: forest_postgres_container
    env_file:
      - ../../.env
    ports:
      - "5431:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  forest_redis:
    image: redis:7.0.15
    container_name: forest_redis_container
    ports:
      - "6378:6379"
    restart: always
    volumes:
      - redis_data:/data

  forest_celery_worker:
     build:
       context: ../..
       dockerfile: docker/dev/Dockerfile
     container_name: forest_celery_worker_container
     command: celery -A config worker --loglevel=info
     env_file:
       - ../../.env
     volumes:
       - ../../src:/app
     depends_on:
       - forest_app
       - forest_redis

  forest_celery_beat:
     build:
       context: ../..
       dockerfile: docker/dev/Dockerfile
     container_name: forest_celery_beat_container
     command: celery -A config beat --loglevel=info
     env_file:
       - ../../.env
     volumes:
       - ../../src:/app
     depends_on:
       - forest_app
       - forest_redis
       - forest_celery_worker

volumes:
  postgres_data:
  redis_data:
