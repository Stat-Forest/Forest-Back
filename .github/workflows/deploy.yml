name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    # Server host kaliti pin'lanadi (audit C10): SSH_KNOWN_HOSTS secret'i
    # (`ssh-keyscan -H <HOST>` natijasi) bo'lsa shu, bo'lmasa keyscan (TOFU).
    - name: Known hosts
      env:
        SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        HOST: ${{ secrets.HOST }}
      run: |
        set -euo pipefail
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        if [ -n "$SSH_KNOWN_HOSTS" ]; then
          printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
        else
          echo "::warning::SSH_KNOWN_HOSTS secret yo'q — ssh-keyscan (TOFU) ishlatilmoqda"
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
        fi

    - name: Copy .env to server
      env:
        ENV_FILE: ${{ secrets.ENV_FILE }}
      run: |
        set -euo pipefail
        # printf: echo qo'shtirnoq/maxsus belgilarni buzishi mumkin
        printf '%s\n' "$ENV_FILE" > .env
        scp .env ${{ secrets.USER }}@${{ secrets.HOST }}:/root/Forest-Back/.env

    - name: Sync files to server via rsync
      run: |
        # --inplace: faylni almashtirish (temp + rename) o'rniga JOYIDA yozadi.
        # Buning SABABI: docker-compose bitta faylni (masalan nginx.conf) bind-mount
        # qilganda, konteyner o'sha faylning INODE'iga bog'lanadi, yo'liga emas.
        # rsync --inplace'siz har safar yangi inode yaratadi (rename orqali) va
        # ishlab turgan konteyner eski, "o'lik" inode'ni o'qishda davom etadi —
        # `nginx -s reload` ham yordam bermaydi, konteynerni qayta yaratish kerak
        # bo'lib qoladi. --inplace shu muammoni butunlay oldini oladi.
        rsync -avz --inplace -e "ssh" \
          --exclude '.git/' \
          --exclude 'media/' \
          --exclude 'staticfiles/' \
          --exclude 'backups/' \
          --exclude '.env' \
          --exclude '__pycache__/' \
          --exclude 'venv/' \
          ./ ${{ secrets.USER }}@${{ secrets.HOST }}:/root/Forest-Back/

    - name: Deploy via SSH
      run: |
        set -euo pipefail
        ssh -T ${{ secrets.USER }}@${{ secrets.HOST }} 'bash -euo pipefail -s' << 'EOF'
          cd /root/Forest-Back

          # Konteynerlar root'da emas (UID 1000, audit B14): bind-mount papkalar
          # app foydalanuvchisiga yoziladigan bo'lsin. rsync fayllarni root
          # sifatida yaratadi — shuning uchun har deploy'da.
          mkdir -p media staticfiles backups /var/log/forest-back
          chown -R 1000:1000 src media staticfiles backups /var/log/forest-back
          chown 1000:1000 .env && chmod 640 .env

          # ---------------------------------------------------------------
          # docker-compose 1.29.2 (V1) + yangi Docker Engine = xavfli birikmа.
          # V1 konteynerni QAYTA YARATISHDA (recreate) eski image'dan
          # 'ContainerConfig' maydonini o'qiydi — yangi Engine esa uni
          # qaytarmaydi → KeyError: 'ContainerConfig'.
          #
          # Yechim: HECH QACHON recreate yo'liga kirmaslik:
          #   * dependency'lar  → --no-recreate (faqat start/create)
          #   * app servislari  → avval TO'LIQ o'chirib, keyin TOZA yaratish
          #
          # MUHIM tartib:
          #   1. Dependency'lar ishga tushiriladi (--no-recreate)
          #   2. App konteynerlar TO'LIQ o'chiriladi (rm -s -f + docker rm)
          #   3. Dangling imagelar tozalanadi (disk joy bo'shatish)
          #   4. Yangi image build qilinadi
          #   5. Yangi konteynerlar yaratiladi (--no-deps — dep'larga tegmaydi)
          # ---------------------------------------------------------------

          COMPOSE="docker-compose -f docker/prod/docker-compose-prod.yml"

          APP_SERVICES="forest_app forest_ws forest_celery_worker forest_celery_beat"
          APP_CONTAINERS="forest_app_prod forest_ws_prod forest_celery_worker_prod forest_celery_beat_prod"
          DEPS="forest_postgres forest_redis e_imzo_server"

          # 1) Dependency'lar ishlab tursin. --no-recreate => recreate yo'q => xato yo'q.
          echo ">>> [1/5] Dependency'lar tekshirilmoqda..."
          $COMPOSE up -d --no-recreate $DEPS

          # 2) Eski app konteynerlarni BUTUNLAY yo'q qilish.
          #    Bu qadam MAJBURIY va BUILD'dan OLDIN bo'lishi kerak:
          #    agar eski konteyner qolsa, V1 "up" da recreate yo'liga kiradi
          #    va ContainerConfig xatosi beradi.
          echo ">>> [2/5] Eski app konteynerlar o'chirilmoqda..."
          $COMPOSE stop $APP_SERVICES 2>/dev/null || true
          $COMPOSE rm -f $APP_SERVICES 2>/dev/null || true
          for c in $APP_CONTAINERS; do
            docker rm -f "$c" >/dev/null 2>&1 || true
          done

          # 3) Dangling (nomi yo'q) imagelarni tozalash — disk joy bo'shatish.
          #    DIQQAT: volume'lar TEGIB BO'LMAYDI (postgres data!)
          echo ">>> [3/5] Eski imagelar tozalanmoqda..."
          docker image prune -f 2>/dev/null || true

          # 4) Yangi kod bilan image yig'ish.
          echo ">>> [4/5] Image yig'ilmoqda..."
          $COMPOSE build $APP_SERVICES

          # 5) Yangi konteynerlar yaratish. Eski konteyner yo'q =>
          #    V1 "create" yo'lidan boradi (recreate emas) => ContainerConfig xato yo'q.
          #    --no-deps => dependency'larga tegmaydi (ular allaqachon ishlayapti).
          echo ">>> [5/5] Yangi konteynerlar ko'tarilmoqda..."
          $COMPOSE up -d --no-deps $APP_SERVICES

          $COMPOSE ps

          # Oldingi yiqilgan deploy'lardan qolgan "<hash>_<nom>" konteynerlarni
          # aniqlash. V1 recreate paytida eski konteynerni rename qiladi va
          # xato bo'lsa shu nomda qoladi.
          ORPHANS="$(docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_' || true)"
          if [ -n "$ORPHANS" ]; then
            echo "!!! DIQQAT: nomi buzilgan konteynerlar bor (eski yiqilgan deploy qoldig'i):"
            echo "$ORPHANS"
            echo "!!! Qo'lda tuzating: docker rm <eski_nom>"
          fi

          # 6) Nginx config o'zgargan bo'lishi mumkin (--inplace rsync tufayli
          #    konteyner buni bind-mount orqali darhol ko'radi) — shuning uchun
          #    har deploy'da xavfsiz tekshirib reload qilamiz. forest_nginx
          #    ataylab recreate QILINMAYDI (yuqoridagi ContainerConfig xatosi
          #    shu yerda ham chiqadi) — faqat ichidagi process'ga signal beriladi.
          echo ">>> [6/6] Nginx config tekshirilmoqda va reload qilinmoqda..."
          if docker exec forest_nginx_prod nginx -t; then
            docker exec forest_nginx_prod nginx -s reload
            echo ">>> Nginx reload qilindi."
          else
            echo "!!! DIQQAT: nginx.conf noto'g'ri — reload QILINMADI, eski config ishlab turibdi."
            echo "!!! Qo'lda tekshiring: docker exec forest_nginx_prod nginx -t"
          fi

          # ESLATMA: postgres / redis / e_imzo_server sozlamasini
          # docker-compose-prod.yml da o'zgartirsangiz, bu skript uni QO'LLAMAYDI.
          # Serverda qo'lda, xuddi shu usulda bajaring:
          #   docker-compose -f docker/prod/docker-compose-prod.yml stop forest_redis
          #   docker-compose -f docker/prod/docker-compose-prod.yml rm -f forest_redis
          #   docker-compose -f docker/prod/docker-compose-prod.yml up -d --no-deps forest_redis
        EOF
