name: CI/CD Deployment

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Set up job
        run: echo "==== CI/CD Started ===="

      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.5.4
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Copy .env to server
        run: |
          scp -o StrictHostKeyChecking=no <(echo "${{ secrets.ENV_FILE }}") ${{ secrets.HOST }}:/root/Forest-Back/.env

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.HOST }} << 'EOF'
            cd /root/Forest-Back
            git pull origin main
            docker compose -f docker/prod/docker-compose-prod.yml down
            docker compose -f docker/prod/docker-compose-prod.yml up --build -d
          EOF
