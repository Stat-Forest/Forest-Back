name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Copy .env to server
      run: |
        set -euo pipefail
        echo "${{ secrets.ENV_FILE }}" > .env
        scp -o StrictHostKeyChecking=no .env ${{ secrets.USER }}@${{ secrets.HOST }}:/root/Forest-Back/.env

    - name: Sync files to server via rsync
      run: |
        rsync -avz -e "ssh -o StrictHostKeyChecking=no" \
          --exclude '.git/' \
          --exclude 'media/' \
          --exclude 'staticfiles/' \
          --exclude 'backups/' \
          --exclude '.env' \
          --exclude '__pycache__/' \
          --exclude 'venv/' \
          ./ ${{ secrets.USER }}@${{ secrets.HOST }}:/root/Forest-Back/

    - name: Restart services via SSH
      run: |
        set -euo pipefail
        ssh -o StrictHostKeyChecking=no -T ${{ secrets.USER }}@${{ secrets.HOST }} 'bash -euo pipefail -s' << 'EOF'
          cd /root/Forest-Back

          COMPOSE="docker-compose -f docker/prod/docker-compose-prod.yml"
          SERVICES="forest_app forest_celery_worker forest_celery_beat"

          $COMPOSE build $SERVICES
          $COMPOSE rm -s -f $SERVICES
          $COMPOSE up -d $SERVICES
          $COMPOSE ps
        EOF
