name: CI/CD Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up SSH
      uses: webfactory/ssh-agent@v0.7.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Copy .env to server
      run: |
        echo "${{ secrets.ENV_FILE }}" > .env
        scp -o StrictHostKeyChecking=no .env ${{ secrets.USER }}@${{ secrets.HOST }}:/home/${{ secrets.USER }}/.env

    - name: Deploy via SSH
      run: |
        ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -T ${{ secrets.USER }}@${{ secrets.HOST }} << 'EOF'
          cd /home/${{ secrets.USER }}/Forest-Back
          git pull origin main
          docker compose -f docker/prod/docker-compose-prod.yml down
          docker compose -f docker/prod/docker-compose-prod.yml up --build -d
        EOF
