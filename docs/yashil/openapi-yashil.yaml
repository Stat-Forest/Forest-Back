components:
  schemas:
    AcceptRequest:
      type: object
      properties:
        executor_name:
          type: string
          maxLength: 300
        version_no:
          type: integer
    ActAttachment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        version_no:
          type: integer
          maximum: 2147483647
          minimum: 0
        original_name:
          type: string
          maxLength: 255
        size:
          type: integer
          maximum: 2147483647
          minimum: 0
        kind:
          $ref: '#/components/schemas/ActAttachmentKindEnum'
        url:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - original_name
      - url
    ActAttachmentKindEnum:
      enum:
      - photo
      - pdf
      - other
      type: string
      description: |-
        * `photo` - Foto
        * `pdf` - PDF
        * `other` - Boshqa
    ActCancelRequest:
      type: object
      properties:
        comment:
          type: string
          default: ''
          maxLength: 4000
    ActDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        number:
          type: string
          maxLength: 40
        index:
          type: integer
          maximum: 32767
          minimum: 0
        status:
          $ref: '#/components/schemas/ActStatusEnum'
        status_cyr:
          type: string
          nullable: true
          readOnly: true
        version_no:
          type: integer
          maximum: 2147483647
          minimum: 0
        is_partial:
          type: boolean
          description: Shu aktdan keyin ham qabul qilinmagan hajm qoladi
        order:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        delivery_date:
          type: string
          nullable: true
          readOnly: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
        returned_at:
          type: string
          format: date-time
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        actions:
          type: array
          items:
            type: string
          readOnly: true
        current_version:
          allOf:
          - $ref: '#/components/schemas/ActVersion'
          readOnly: true
        versions:
          type: array
          items:
            $ref: '#/components/schemas/ActVersion'
          readOnly: true
        attachments:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        document:
          allOf:
          - $ref: '#/components/schemas/Document'
          readOnly: true
        last_return:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
      required:
      - actions
      - approved_at
      - attachments
      - created_at
      - current_version
      - delivery_date
      - document
      - id
      - index
      - last_return
      - number
      - order
      - returned_at
      - status_cyr
      - updated_at
      - versions
    ActLineInRequest:
      type: object
      properties:
        order_line:
          type: string
          format: uuid
        qty:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
      required:
      - order_line
      - qty
    ActLineOut:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        order_line:
          type: string
          format: uuid
          readOnly: true
        catalog_item:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        qty:
          type: string
          nullable: true
          readOnly: true
        ordered_qty:
          type: string
          nullable: true
          readOnly: true
        unit_cyr:
          type: string
          nullable: true
          readOnly: true
      required:
      - catalog_item
      - id
      - order_line
      - ordered_qty
      - qty
      - unit_cyr
    ActList:
      type: object
