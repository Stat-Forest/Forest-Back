openapi: 3.0.3
info:
  title: STAT-URMON — «Яшил маҳалла» API
  version: '1.0'
  description: 'Барча ўзгартириш сўровларида Authorization (Bearer JWT) ва жорий version_no
    узатилади; ҳолат ўзгартирувчи POST амалларда Idempotency-Key мажбурий. Фаол кабинет
    X-Yashil-Cabinet сарлавҳаси билан танланади. Хато жавоби: error_code, field, message,
    request_id (TZ §21). Ваколат ва кўлам ҳар сўровда серверда текширилади.'
paths:
  /api/v1/yashil/acts/:
    get:
      operationId: yashil_acts_get
      summary: Актлар рўйхати
      parameters:
      - in: header
        name: X-Yashil-Cabinet
        schema:
          type: string
          format: uuid
        description: Фаол кабинет (аъзолик ID). Бўлмаса — биринчи фаол аъзолик.
      - in: query
        name: catalog_item
        schema:
          type: string
        description: Каталог позицияси ID
      - in: query
        name: category
        schema:
          type: string
        description: Каталог тоифаси
      - in: query
        name: date_from
        schema:
          type: string
          format: date
        description: Давр боши (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
          format: date
        description: Давр охири (YYYY-MM-DD)
      - in: query
        name: district
        schema:
          type: string
        description: Туман ID
      - in: query
        name: mahalla
        schema:
          type: string
        description: Маҳалла ID
      - in: query
        name: order
        schema:
          type: string
        description: Буюртма ID
      - in: query
        name: overdue
        schema:
          type: string
        description: Фақат муддати ўтганлар (1)
      - in: query
        name: page
        schema:
          type: integer
        description: Саҳифа рақами
      - in: query
        name: per_page
        schema:
          type: integer
        description: Саҳифадаги қатор (энг кўпи 100–200)
      - in: query
        name: period_basis
        schema:
          type: string
          enum:
          - accepted
          - delivered
          - submitted
        description: Давр асоси
      - in: query
        name: q
        schema:
          type: string
        description: Рақам, буюртма ёки маҳалла
      - in: query
        name: region
        schema:
          type: string
        description: Вилоят ID
      - in: query
        name: route
        schema:
          type: string
          enum:
          - dm
          - forest
        description: Йўналиш
      - in: query
        name: status
        schema:
          type: string
        description: Ҳолатлар, вергул билан
      - in: query
        name: supplier_org
        schema:
          type: string
        description: Етказиб берувчи ташкилот ID
      tags:
      - Далолатномалар
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YashilError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YashilError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/YashilError'
          description: ''
        '404':
          content:
