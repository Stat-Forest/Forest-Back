  /api/v1/general/organization/:
    get:
      operationId: api_v1_general_organization_list
      description: |-
        CustomListAPIView: Used to create read-only endpoints to represent a collection of model instances.
        Provides a GET method handler.
        Example: Use to display a list of blog posts or user profiles.
      parameters:
      - in: query
        name: name
        schema:
          type: string
      - in: query
        name: region
        schema:
          type: string
          enum:
          - andijon
          - buxoro
          - fargona
          - jizzax
          - namangan
          - navoiy
          - qashqadaryo
          - qoraqalpog‘iston
          - republic
          - samarqand
          - sirdaryo
          - surxondaryo
          - tashkent
          - xorazm
        description: |-
          * `tashkent` - Toshkent
          * `namangan` - Namangan
          * `andijon` - Andijon
          * `fargona` - Farg'ona
          * `buxoro` - Buxoro
          * `samarqand` - Samarqand
          * `navoiy` - Navoiy
          * `qashqadaryo` - Qashqadaryo
          * `surxondaryo` - Surxondaryo
          * `xorazm` - Xorazm
          * `sirdaryo` - Sirdaryo
          * `jizzax` - Jizzax
          * `qoraqalpog‘iston` - Qoraqalpog'iston
          * `republic` - Respublika tashkilotlari
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - General
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrganizationList'
          description: ''
  /api/v1/information-analytical/:
    get:
      operationId: api_v1_information_analytical_retrieve
      description: "\n        Region va organization bo‘yicha o‘rmon monitoring ma’lumotlarini\
        \ chiqaradi.\n\n        \U0001F4CC Agar region berilsa → faqat shu hudud va\
        \ uning tashkilotlari chiqadi\n        \U0001F4CC Agar organization berilsa\
        \ → faqat shu tashkilot chiqadi  \n        \U0001F4CC Agar hech nima berilmasa\
        \ → Respublika → Regionlar → Tashkilotlar chiqadi\n        "
      summary: Forest monitoring – analytical aggregation
      parameters:
      - in: query
        name: lang
        schema:
          type: string
        description: Til (uz yoki ru)
      - in: query
        name: organization
        schema:
          type: string
          format: uuid
        description: Organization ID bo‘yicha filter
      - in: query
        name: period
        schema:
          type: string
        description: |-
          Hisobot davri bo‘yicha filter.

          Formatlar:
          • Yillik: 2025
          • Choraklik: 2025-CHORAK_1, 2025-CHORAK_2, 2025-CHORAK_3, 2025-CHORAK_4
          • Oylik: 2025-01

          Agar period berilsa, faqat shu davrga tegishli accepted reportlar hisobga olinadi. Agar ma’lumot topilmasa — bo‘sh list qaytadi.
      - in: query
        name: region
        schema:
          type: string
        description: 'Region kodi (masalan: ANDIJON, SAMARQAND, TOSHKENT)'
      tags:
      - Information-Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/information-analytical/export-excel/:
    get:
      operationId: api_v1_information_analytical_export_excel_retrieve
      description: Forest monitoring ma’lumotlarini Excel formatda eksport qilish
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - ru
          - uz
        description: 'Til (uz/ru), default: uz'
      - in: query
        name: organization
        schema:
          type: string
          format: uuid
        description: Organization UUID
      - in: query
        name: period
        schema:
          type: string
        description: 'Davr: Yillik (2025), Choraklik (2025-CHORAKLIK_1), Oylik (2025-01)'
      - in: query
        name: region
        schema:
          type: string
        description: Region kodi (ANDIJON, TOSHKENT, SAMARQAND, ...)
      tags:
      - Information-Analytics
      security:
      - BearerAuth: []
      responses:
        '200':
          description: No response body
