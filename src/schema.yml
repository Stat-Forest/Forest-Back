  /api/v1/general/announcements/:
    get:
      operationId: api_v1_general_announcements_list
      description: |-
        API endpoint that returns active announcements.

        Security:
        - Accessible only for authenticated users.
        - Language parameter is validated before usage.

        Performance:
        - Queryset is cached to reduce database load.
        - Cache is automatically cleared via signals when data changes.
      parameters:
      - in: query
        name: lang
        schema:
          type: string
          enum:
          - ru
          - uz
        description: Select language (uz or ru)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: title
        schema:
          type: string
      tags:
      - Announcement
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAnnouncementListList'
          description: ''
  /api/v1/general/handbooks/:
    get:
      operationId: api_v1_general_handbooks_list
      description: |-
        API endpoint for handbook documents.

        GET:
            Returns visible handbooks (is_seen=True)

        POST:
            Creates new handbook (authenticated users only)

        Security:
            - Accessible only for authenticated users

        Performance:
            - Uses caching to reduce database queries
            - Cache cleared automatically via signals
      parameters:
