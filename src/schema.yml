  /api/v1/general/land-documents/:
    get:
      operationId: api_v1_general_land_documents_list
      description: |-
        API endpoint for Land Documents.

        GET:
            Returns all land documents

        POST:
            Creates a new land document (authenticated users only)

        Security:
            - Accessible only for authenticated users

        Performance:
            - Uses Redis cache to reduce database queries
            - select_related prevents N+1 queries
            - Cache automatically cleared via Django signals
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: per_page
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - Land document
      security:
      - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLandDocumentList'
          description: ''
    post:
      operationId: api_v1_general_land_documents_create
      description: |-
        API endpoint for Land Documents.

        GET:
            Returns all land documents

        POST:
            Creates a new land document (authenticated users only)

        Security:
            - Accessible only for authenticated users

        Performance:
            - Uses Redis cache to reduce database queries
            - select_related prevents N+1 queries
            - Cache automatically cleared via Django signals
      tags:
      - Land document
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LandDocumentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LandDocumentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LandDocumentRequest'
        required: true
      security:
