          - uz
        description: 'Tilni belgilang: uz yoki ru'
      - in: query
        name: organization_name
        schema:
          type: string
        description: Tashkilot nomi
      - in: query
        name: organization_region
        schema:
          type: string
          enum:
          - andijon
          - buxoro
          - fargona
          - jizzax
          - namangan
          - navoiy
          - qashqadaryo
          - qoraqalpog‘iston
          - republic
          - samarqand
          - sirdaryo
          - surxondaryo
          - tashkent
          - xorazm
        description: |-
          Viloyat

          * `tashkent` - Toshkent
          * `namangan` - Namangan
          * `andijon` - Andijon
          * `fargona` - Farg'ona
          * `buxoro` - Buxoro
          * `samarqand` - Samarqand
          * `navoiy` - Navoiy
          * `qashqadaryo` - Qashqadaryo
          * `surxondaryo` - Surxondaryo
          * `xorazm` - Xorazm
          * `sirdaryo` - Sirdaryo
          * `jizzax` - Jizzax
          * `qoraqalpog‘iston` - Qoraqalpog'iston
          * `republic` - Respublika tashkilotlari
      - name: page
